
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه کوچولوی ستیا 💗</title>

<style>
:root {
  --pink: #f5a9cf;
  --hot: #d95b9d;
  --lilac: #c9b8f5;
  --deep: #704a91;
  --ink: #594666;
  --paper: #fffafd;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Tahoma, Arial, sans-serif;
  color: var(--ink);
  background: linear-gradient(135deg, #fff4fa, #f4efff, #fff8fc);
  overflow-x: hidden;
}

button, input { font: inherit; }
button { cursor: pointer; }

.wrap {
  width: min(900px, 92%);
  margin: auto;
  padding: 24px 0 36px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.brand {
  color: var(--deep);
  font-size: 21px;
  font-weight: bold;
}

.pill {
  background: white;
  border: 1px solid #f1c9e0;
  border-radius: 30px;
  padding: 9px 14px;
  font-size: 13px;
}

.progress-shell {
  height: 9px;
  background: #eadff4;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 24px;
}

#progress {
  width: 10%;
  height: 100%;
  background: linear-gradient(90deg, var(--lilac), var(--hot));
  transition: width .4s ease;
}

.card {
  background: rgba(255,255,255,.92);
  border: 1px solid #f4d8e8;
  box-shadow: 0 18px 55px rgba(185,154,197,.16);
  border-radius: 28px;
  padding: clamp(22px, 5vw, 42px);
  min-height: 390px;
  animation: appear .4s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

.eyebrow {
  display: inline-block;
  background: #f9e7f2;
  color: #a34f84;
  padding: 7px 13px;
  border-radius: 25px;
  font-size: 13px;
  margin-bottom: 12px;
}

h1 {
  color: #795391;
  font-size: clamp(25px, 5vw, 36px);
  line-height: 1.8;
  margin: 0 0 12px;
}

p {
  font-size: 16px;
  line-height: 2.2;
  margin: 12px 0;
}

.hero-icon {
  display: block;
  font-size: 58px;
  margin: 8px 0;
  animation: bob 3s ease-in-out infinite;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.btn {
  border: 0;
  border-radius: 15px;
  padding: 13px 20px;
  background: linear-gradient(135deg, #eaa2ca, #bda9ef);
  color: white;
  font-weight: bold;
  transition: transform .2s ease;
}

.btn:hover { transform: translateY(-2px); }

.secondary {
  background: white;
  color: #9166a9;
  border: 1px solid #e9d8f3;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
  gap: 12px;
  margin-top: 18px;
}

.tile {
  border: 1px solid #ecd9f4;
  background: #fff7fc;
  border-radius: 18px;
  padding: 16px 10px;
  text-align: center;
  line-height: 2;
}

.tile strong {
  display: block;
  color: #9c6db2;
  font-size: 24px;
}

.choices {
  display: grid;
  gap: 10px;
  margin: 18px 0;
}

.choice {
  border: 1px solid #e7d6f1;
  border-radius: 14px;
  padding: 13px 15px;
  background: white;
  text-align: right;
  color: var(--ink);
}

.choice:hover { background: #fff3fa; }
.choice.correct { background: #eaf9ef; border-color: #87c99b; }
.choice.wrong { background: #fff0f2; border-color: #e8a0ad; }

.feedback {
  min-height: 24px;
  color: #9161a7;
  font-weight: bold;
  line-height: 2;
}

.note {
  background: #fff6fb;
  border-right: 4px solid #e8a2c9;
  padding: 14px;
  border-radius: 12px;
  margin-top: 18px;
  line-height: 2;
}

.reaction {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 24px 0;
}

.bubble {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #f8d7eb;
  color: #965d94;
  font-weight: bold;
}

.arrow { font-size: 25px; color: #c18ac8; }

.meter {
  height: 14px;
  background: #eee2f5;
  border-radius: 20px;
  overflow: hidden;
  margin: 18px 0;
}

#energyFill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, #c7b6f5, #f2a5d0);
  transition: width .3s;
}

.letter {
  background: linear-gradient(135deg, #fff8fc, #f7f2ff);
  border: 1px dashed #d9b5e7;
  border-radius: 20px;
  padding: 20px;
  line-height: 2.3;
}

.dots {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 7px;
  margin: 18px 0;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 20px;
  background: #dfd2ec;
  border: 0;
  padding: 0;
}

.dot.active {
  width: 25px;
  background: #d98cba;
}

.footer {
  text-align: center;
  font-size: 12px;
  opacity: .75;
  margin-top: 18px;
}

.sparkle {
  position: fixed;
  pointer-events: none;
  opacity: .5;
  animation: bob 5s ease-in-out infinite;
  z-index: 0;
}

#toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: #6d4b80;
  color: white;
  padding: 12px 18px;
  border-radius: 30px;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}

#toast.show { opacity: 1; }

@media(max-width:560px) {
  .top { align-items: flex-start; flex-direction: column; }
  .card { border-radius: 22px; }
  p { font-size: 15px; }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="sparkle" style="top:12%;left:7%">✦</div>
<div class="sparkle" style="top:36%;right:5%">♡</div>
<div class="sparkle" style="top:72%;left:11%">✧</div>
<div class="sparkle" style="top:83%;right:8%">✿</div>

<div class="wrap">
  <header class="top">
    <div class="brand">🧪 آزمایشگاه کوچولوی ستیا</div>
    <div class="pill" id="stageLabel">مرحلهٔ ۱ از ۱۰</div>
  </header>

  <div class="progress-shell">
    <div id="progress"></div>
  </div>

  <main class="card" id="stage" aria-live="polite"></main>
  <nav class="dots" id="dots" aria-label="مراحل"></nav>
  <div class="footer">با کمی شیمی، کمی جادو و کلی حس خوب ساخته شده ♡</div>
</div>

<div id="toast" role="status"></div>

<script>
"use strict";

const stages = [
{
tag:"شروع یک ماجرای کوچولو",
icon:"🌷",
title:"سلام ستیا جان!",
body:"یه گوشه‌ی کوچولو از اینترنت رو برات آماده کردم؛ جایی که قرار نیست امتحان سختی بدی یا چیزی رو حفظ کنی. فقط قراره چند دقیقه از روزت رو با لبخند بگذرونی و بین چند تا کشف بامزه قدم بزنی. این آزمایشگاه مثل یه پاکت کوچولوی صورتیه که توش چندتا سورپرایز قایم شده. هر مرحله یه بهونه‌ست برای اینکه بگم بودنت قشنگه و امیدوارم امروزت، حتی برای چند دقیقه، روشن‌تر بشه. ♡",
button:"بزن بریم، کنجکاوم!"
},
{
tag:"عنصر خیالی شمارهٔ یک",
icon:"💗",
title:"عنصر کمیابِ ستیا",
body:"توی جدول تناوبی کلی عنصر واقعی داریم؛ اما من فکر کردم یه خونه‌ی کوچولو هم برای یه عنصر خیالی باز کنیم: عنصر St! نمادش از اسم ستیا الهام گرفته شده و ویژگی‌هاش هم خیلی خاصه. البته این عنصر توی شیمی واقعی وجود نداره؛ این یکی رو فقط برای این داستان ساختیم. می‌گن هرجا مقدار کمی از این عنصر پیدا بشه، فضا یه ذره مهربون‌تر می‌شه، لبخندها راحت‌تر پیداشون می‌شه و روزهای معمولی یه رنگ قشنگ‌تر می‌گیرن. شاید مهم‌ترین خاصیتش این باشه که یادمون بندازه بعضی آدما بدون اینکه کار خارق‌العاده‌ای بکنن، می‌تونن برای بقیه عزیز باشن.",
button:"ویژگی‌های عنصر رو ببین"
},
{
tag:"واکنش شیمیاییِ حال‌خوب",
icon:"⚗️",
title:"وقتی مهربونی با لبخند ترکیب می‌شه",
body:"یه واکنش خیالی داریم؛ نه مواد خطرناک داره، نه نیاز به آزمایشگاه واقعی. فقط چندتا چیز خوب رو با هم قاطی می‌کنیم و نتیجه‌ش رو تصور می‌کنیم. گاهی یه پیام ساده، یه توجه کوچیک یا اینکه کسی یادش باشه حالت رو بپرسه، می‌تونه روز آدم رو بهتر کنه. برای همین توی این آزمایشگاه، مواد اولیه‌مون مهربونی و خنده‌ست. آماده‌ای واکنش رو روشن کنیم؟",
button:"واکنش رو شروع کن",
reaction:true
},
{
tag:"آزمون کوچولوی شیمی",
icon:"🧠",
title:"یه سؤال آسون برای دانشمند کوچولو",
body:"قول می‌دم این امتحان نمره و استرس نداره! فقط می‌خوایم ببینیم حواست به آزمایشگاه هست یا نه. توی شیمی واقعی، آب از ترکیب کدوم دو عنصر ساخته شده؟",
quiz:true
},
{
tag:"جدول تناوبیِ چیزهای قشنگ",
icon:"🌈",
title:"جدولی که توی کتاب‌ها نیست",
body:"این جدول علمی نیست؛ یه جدول کوچولوی خیالیه برای چیزهایی که ارزششون از خیلی فرمول‌ها بیشتره. هر خونه یه یادآوریه که دنیا فقط از کار و عجله و روزهای شلوغ ساخته نشده؛ گاهی باید مکث کنیم و چیزهای کوچیک و قشنگ رو هم ببینیم. امیدوارم هرکدوم از این خونه‌ها یه لبخند کوچولو مهمون صورتت کنه.",
tiles:[["♡","مهربونی"],["☀","امید"],["✿","خنده"],["✧","آرامش"],["☆","رویا"],["💌","توجه"]],
button:"مرحله‌ی بعد"
},
{
tag:"معمای هیدروژن",
icon:"💧",
title:"معمای یه عنصر سبک",
body:"هیدروژن سبک‌ترین عنصر جدول تناوبیه و نماد شیمیایی اون H هست. حالا یه سؤال کوچولو: نماد شیمیایی هیدروژن کدومه؟ آروم فکر کن؛ اینجا قرار نیست عجله کنیم.",
quiz2:true
},
{
tag:"باتری انرژی مثبت",
icon:"🔋",
title:"باتریِ حال خوب رو شارژ کن",
body:"بعضی وقت‌ها انرژی آدم با استراحت، حرف زدن با یه آدم امن، گوش دادن به موسیقی یا یه خنده‌ی ساده برمی‌گرده. این باتری هم فقط یه بازی کوچولوئه؛ روی دکمه بزن تا نوار انرژی خیالی پر بشه. امیدوارم خودت هم یادت بمونه که لازم نیست همیشه پرانرژی باشی؛ حق داری خسته بشی و به خودت فرصت بدی.",
meter:true,
button:"ادامه"
},
{
tag:"پیام محرمانه",
icon:"🔐",
title:"یه پیام پشت در کوچولو",
body:"برای باز کردن این بخش، اسم خودت رو وارد کن. این قفل فقط نمایشی و بامزه‌ست و هیچ اطلاعاتی جایی فرستاده نمی‌شه. جوجه‌ی کوچولوی آزمایشگاه هم منتظره ببینه یادت مونده رمز چیه یا نه! 🐣",
lock:true
},
{
tag:"یه نامه‌ی کوچولوی صمیمی",
icon:"💌",
title:"چند خط فقط برای تو",
body:"ستیا جان، شاید گفتن بعضی چیزها رو در پیام‌های معمولی سخت بشه شروع کرد؛ برای همین این چند خط رو لای یه آزمایشگاه کوچولو گذاشتم. می‌خواستم بدونی که برام آدم عزیز و قابل‌توجهی هستی و بودن و حرف زدنت می‌تونه حس خوبی به روز آدم بده. نمی‌خوام با این حرف‌ها چیزی رو بهت تحمیل کنم یا ازت انتظار جواب خاصی داشته باشم؛ فقط دلم خواست یه ذره از حس خوبم رو باهات شریک بشم. امیدوارم هرجا هستی، آدم‌هایی دوروبرت باشن که قدر لبخندت، مهربونی‌ات و خودِ واقعی‌ات رو بدونن. اگه این صفحه حتی برای چند ثانیه لبخند آورد روی لبت، مأموریت کوچولوش رو انجام داده. مراقب خودت باش، چون خوشحال بودنت مهمه. راستی به گودزیلای 🧌 غرغرو هم بگو امروز حق نداره لبخندتو بدزده! ♡",
button:"بریم سورپرایز آخر"
},
{
tag:"پایانِ صورتی",
icon:"🎀",
title:"آزمایش با موفقیت تموم شد!",
body:"خب دانشمند کوچولو، به آخر آزمایشگاه رسیدیم! نتیجه‌ی نهایی: یه عالمه قلب صورتی، چندتا لبخند خیالی و یه پیام کوچولو که می‌گه تو ارزشمند و دوست‌داشتنی هستی. این صفحه شاید ساده باشه، ولی با فکر تو ساخته شده؛ امیدوارم هر وقت روزت سخت شد، یادت بیاد که شایسته‌ی مهربونی، احترام و لحظه‌های قشنگی. ممنون که تا آخر این ماجرای کوچولو اومدی. جوجه‌ی 🐣 آزمایشگاه هم برات دست تکون می‌ده! ✨",
button:"از اول دوباره ببین",
finale:true
}
];

let current = 0;
let energy = 0;

const stageEl = document.getElementById("stage");
const progressEl = document.getElementById("progress");
const labelEl = document.getElementById("stageLabel");
const dotsEl = document.getElementById("dots");
const toastEl = document.getElementById("toast");

function notify(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  window.setTimeout(function() {
    toastEl.classList.remove("show");
  }, 2100);
}

function renderDots() {
  dotsEl.replaceChildren();

  stages.forEach(function(_, index) {
    const button = document.createElement("button");
    button.className = "dot" + (index === current ? " active" : "");
    button.type = "button";
    button.setAttribute("aria-label", "رفتن به مرحله " + (index + 1));
    button.addEventListener("click", function() {
      go(index);
    });
    dotsEl.appendChild(button);
  });
}

function go(index) {
  current = Math.max(0, Math.min(stages.length - 1, index));
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function next() {
  if (current === stages.length - 1) {
    energy = 0;
    go(0);
  } else {
    go(current + 1);
  }
}

function render() {
  const stage = stages[current];

  labelEl.textContent = "مرحلهٔ " + (current + 1) + " از " + stages.length;
  progressEl.style.width = ((current + 1) / stages.length * 100) + "%";
  renderDots();

  let extra = "";

  if (stage.reaction) {
    extra = `
      <div class="reaction">
        <div class="bubble">مهربونی</div>
        <span class="arrow">+</span>
        <div class="bubble" style="background:#e7ddfb">لبخند</div>
        <span class="arrow">→</span>
        <div class="bubble" style="background:#fbe7a8">✨</div>
      </div>
      <p class="feedback" id="reactionFeedback"></p>
    `;
  }

  if (stage.quiz) {
    extra = `
      <div class="choices">
        <button class="choice" data-answer="no">اکسیژن و کربن</button>
        <button class="choice" data-answer="yes">هیدروژن و اکسیژن</button>
        <button class="choice" data-answer="no">نیتروژن و هلیوم</button>
        <button class="choice" data-answer="no">آهن و مس</button>
      </div>
      <p class="feedback" id="quizFeedback"></p>
    `;
  }

  if (stage.quiz2) {
    extra = `
      <div class="choices">
        <button class="choice" data-answer="no">O</button>
        <button class="choice" data-answer="yes">H</button>
        <button class="choice" data-answer="no">He</button>
        <button class="choice" data-answer="no">N</button>
      </div>
      <p class="feedback" id="quizFeedback"></p>
    `;
  }

  if (stage.tiles) {
    extra = '<div class="grid">' + stage.tiles.map(function(tile) {
      return '<div class="tile"><strong>' + tile[0] + '</strong>' + tile[1] + '</div>';
    }).join("") + '</div>';
  }

  if (stage.meter) {
    extra = `
      <div class="meter"><div id="energyFill"></div></div>
      <p id="energyText" class="feedback">انرژی: ${energy}٪</p>
      <button class="btn" id="chargeBtn">⚡ یه ذره انرژی اضافه کن</button>
    `;
  }

  if (stage.lock) {
    extra = `
      <div class="actions">
        <input id="nameInput" aria-label="اسم" placeholder="اسم رو بنویس..."
          style="flex:1;min-width:180px;padding:13px;border:1px solid #e6d3ef;border-radius:13px;background:#fff">
        <button class="btn" id="unlockBtn">باز کردن پیام 💌</button>
      </div>
      <p class="feedback" id="lockFeedback"></p>
    `;
  }

  if (stage.finale) {
    extra = '<div class="reaction"><span class="hero-icon">🌸</span><span class="hero-icon">💗</span><span class="hero-icon">✨</span></div>';
  }

  stageEl.innerHTML =
    '<span class="eyebrow">' + stage.tag + '</span>' +
    '<span class="hero-icon" aria-hidden="true">' + stage.icon + '</span>' +
    '<h1>' + stage.title + '</h1>' +
    '<p>' + stage.body + '</p>' +
    extra +
    '<div class="actions">' +
      (stage.reaction ? '<button class="btn" id="reactionBtn">مواد رو ترکیب کن</button>' : '') +
      (!stage.lock ? '<button class="btn" id="nextBtn">' + stage.button + '</button>' : '') +
      (current > 0 && !stage.finale ? '<button class="btn secondary" id="backBtn">مرحله‌ی قبل</button>' : '') +
    '</div>';

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", next);

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", function() {
    go(current - 1);
  });

  const reactionBtn = document.getElementById("reactionBtn");
  if (reactionBtn) {
    reactionBtn.addEventListener("click", function() {
      document.getElementById("reactionFeedback").textContent =
        "تق تق! واکنش انجام شد: نتیجه‌ی خیالی، یه عالمه حال خوبه! ✨";
      reactionBtn.textContent = "واکنش انجام شد ✓";
      reactionBtn.disabled = true;
    });
  }

  document.querySelectorAll("[data-answer]").forEach(function(button) {
    button.addEventListener("click", function() {
      document.querySelectorAll("[data-answer]").forEach(function(choice) {
        choice.disabled = true;
        if (choice.dataset.answer === "yes") choice.classList.add("correct");
      });

      const correct = button.dataset.answer === "yes";
      if (!correct) button.classList.add("wrong");

      const feedback = document.getElementById("quizFeedback");
      if (feedback) {
        feedback.textContent = correct
          ? "آفرین جوجه‌ی دانشمند! 🐣 جواب درسته. آب H₂O است؛ یعنی از هیدروژن و اکسیژن ساخته شده."
          : "اشکالی نداره! جواب درست با رنگ سبز مشخص شده. دانشمندها هم با تمرین یاد می‌گیرن. ♡";
      }
    });
  });

  const chargeBtn = document.getElementById("chargeBtn");
  if (chargeBtn) {
    const fill = document.getElementById("energyFill");
    fill.style.width = energy + "%";

    chargeBtn.addEventListener("click", function() {
      energy = Math.min(100, energy + 25);
      fill.style.width = energy + "%";
      document.getElementById("energyText").textContent = "انرژی: " + energy + "٪";

      if (energy === 100) {
        chargeBtn.textContent = "باتری پر شد! ✓";
        notify("باتری حال خوب شارژ شد ✨");
      } else {
        notify("یه ذره انرژی صورتی اضافه شد!");
      }
    });
  }

  const unlockBtn = document.getElementById("unlockBtn");
  if (unlockBtn) {
    unlockBtn.addEventListener("click", function() {
      const input = document.getElementById("nameInput");
      const value = input.value.trim().toLowerCase().replace(/\s+/g, "");
      const feedback = document.getElementById("lockFeedback");

      if (value === "ستیا" || value === "setia") {
        notify("پیام با موفقیت باز شد 💌");
        go(8);
      } else {
        feedback.textContent = "یه بار دیگه اسم رو امتحان کن: ستیا یا Setia ♡";
      }
    });
  }
}

render();
</script>
</body>
</html>
