<!DOCTYPE html>
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمایشگاه مخفی ستیا 💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root {
  --pink: #ff8fba;
  --pink-dark: #e85f98;
  --light-pink: #fff0f6;
  --lilac: #c7b5ff;
  --purple: #8d72d9;
  --white: #fffdfd;
  --text: #624b69;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, #fff0f6, #f3edff, #fff8fc);
  overflow-x: hidden;
}

button, input { font: inherit; }

button {
  cursor: pointer;
  border: none;
  transition: .25s;
}

button:hover { transform: translateY(-3px) scale(1.02); }

.background-hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.float-heart {
  position: absolute;
  bottom: -50px;
  opacity: .4;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
}

header {
  text-align: center;
  padding: 25px 12px 5px;
  position: relative;
  z-index: 1;
}

.logo {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--pink-dark);
}

.subtitle { font-size: .9rem; opacity: .8; }

.progress-wrap {
  width: min(650px, 90%);
  margin: 15px auto;
  height: 9px;
  border-radius: 30px;
  background: #ffffffb5;
  overflow: hidden;
  border: 1px solid #f6d9e8;
}

.progress {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--pink), var(--lilac));
  border-radius: 30px;
  transition: width .5s;
}

main {
  width: min(720px, 92%);
  margin: 12px auto 40px;
  position: relative;
  z-index: 1;
}

.card {
  background: #ffffffdb;
  border: 1px solid #ffffff;
  box-shadow: 0 15px 45px #c49abb28;
  border-radius: 28px;
  padding: clamp(20px, 5vw, 38px);
  min-height: 390px;
  animation: appear .45s ease;
  backdrop-filter: blur(10px);
}

@keyframes appear {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.stage-label {
  color: var(--pink-dark);
  background: var(--light-pink);
  display: inline-block;
  padding: 7px 14px;
  border-radius: 30px;
  font-size: .85rem;
  font-weight: 700;
}

h1, h2 { line-height: 1.8; }

h1 {
  font-size: clamp(1.5rem, 5vw, 2.25rem);
  margin: 15px 0 10px;
}

h2 { font-size: 1.35rem; }

p {
  line-height: 2.15;
  font-size: 1rem;
}

.big-emoji {
  text-align: center;
  font-size: 4rem;
  margin: 10px 0;
  animation: bob 2s ease-in-out infinite;
}

@keyframes bob {
  50% { transform: translateY(-8px) rotate(4deg); }
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 11px;
  margin-top: 25px;
}

.btn {
  padding: 12px 21px;
  border-radius: 16px;
  font-weight: 700;
}

.primary {
  color: white;
  background: linear-gradient(135deg, var(--pink-dark), #b99cff);
  box-shadow: 0 7px 18px #d889ba35;
}

.secondary {
  background: #f5efff;
  color: #775cb5;
}

.option-list {
  display: grid;
  gap: 12px;
  margin: 20px 0;
}

.option {
  text-align: right;
  background: #fff7fb;
  color: var(--text);
  border: 1px solid #f5dbea;
  border-radius: 15px;
  padding: 13px 16px;
}

.option:hover { background: #f8edff; }

.option.correct {
  background: #e5faee;
  border-color: #92d6ad;
}

.option.wrong {
  background: #fff0f0;
  border-color: #f1aaaa;
}

.feedback {
  display: none;
  padding: 14px;
  border-radius: 15px;
  background: #f8f2ff;
  line-height: 2;
  margin-top: 15px;
}

.note {
  background: linear-gradient(135deg, #fff2f8, #f5f0ff);
  border-right: 4px solid var(--pink);
  padding: 15px;
  border-radius: 14px;
  line-height: 2.1;
  margin: 18px 0;
}

.meter {
  background: #f0e8fa;
  height: 18px;
  border-radius: 30px;
  overflow: hidden;
  margin: 20px 0;
}

.meter-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff8fba, #b6a0ff);
  transition: width .5s;
  border-radius: 30px;
}

.secret-input {
  width: 100%;
  border: 2px solid #eadcfb;
  background: #fffaff;
  padding: 13px;
  border-radius: 13px;
  outline: none;
  margin: 10px 0;
}

.secret-input:focus { border-color: var(--pink); }

.letter {
  white-space: pre-line;
  background: #fff8fc;
  border: 1px dashed #edacd0;
  border-radius: 20px;
  padding: 20px;
  line-height: 2.3;
}

footer {
  text-align: center;
  font-size: .8rem;
  padding: 10px 15px 25px;
  opacity: .75;
  position: relative;
  z-index: 1;
}

.small { font-size: .88rem; opacity: .8; }

.center { text-align: center; }

.pill {
  display: inline-block;
  background: #f3edff;
  color: #8267be;
  padding: 7px 12px;
  margin: 4px;
  border-radius: 30px;
  font-size: .85rem;
}

.hidden { display: none !important; }

@media(max-width: 480px) {
  .card { min-height: 420px; border-radius: 23px; }
  .btn { width: 100%; }
  .buttons { flex-direction: column; }
}
</style>
</head>

<body>

<div class="background-hearts" id="hearts"></div>

<header>
  <div class="logo">🧪 آزمایشگاه مخفی ستیا 💗</div>
  <div class="subtitle">پرونده‌ای محرمانه درباره‌ی یک جوجه‌ی خاص و یک گودزیلای مشکوک</div>
  <div class="progress-wrap">
    <div class="progress" id="progress"></div>
  </div>
  <div class="small" id="stageCounter">مرحله‌ی ۱ از ۱۰</div>
</header>

<main>
  <section class="card" id="app"></section>
</main>

<footer>
  ساخته‌شده با کمی شیمی، کلی ذوق و یک عالمه قلب صورتی 💗
</footer>

<script>
const app = document.getElementById('app');
const progress = document.getElementById('progress');
const stageCounter = document.getElementById('stageCounter');

let stage = 0;
let energy = 0;
let quizScore = 0;
let secretUnlocked = false;

function hearts() {
  const container = document.getElementById('hearts');
  const icons = ['💗', '♡', '✨', '🌸', '💖'];

  for (let i = 0; i < 22; i++) {
    const heart = document.createElement('span');
    heart.className = 'float-heart';
    heart.textContent = icons[Math.floor(Math.random() * icons.length)];
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (12 + Math.random() * 22) + 'px';
    heart.style.animationDuration = (8 + Math.random() * 13) + 's';
    heart.style.animationDelay = (-Math.random() * 15) + 's';
    container.appendChild(heart);
  }
}

hearts();

function updateProgress() {
  progress.style.width = ((stage + 1) / 10 * 100) + '%';
  stageCounter.textContent = `مرحله‌ی ${stage + 1} از ۱۰`;
}

function go(next) {
  stage = Math.max(0, Math.min(9, next));
  render();
}

function nextButton(text = 'بریم مرحله‌ی بعدی 💗') {
  return `<div class="buttons"><button class="btn primary" onclick="go(${stage + 1})">${text}</button></div>`;
}

function optionQuiz(question, options, correct, explanation) {
  return `
    <h2>${question}</h2>
    <div class="option-list">
      ${options.map((option, i) =>
        `<button class="option" onclick="answer(this, ${i}, ${correct}, '${explanation}')">${option}</button>`
      ).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
  `;
}

function answer(button, chosen, correct, explanation) {
  const buttons = button.parentElement.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);

  if (chosen === correct) {
    button.classList.add('correct');
    quizScore++;
    document.getElementById('feedback').innerHTML =
      'آفرین! 🥳 جواب درست بود. ' + explanation;
  } else {
    button.classList.add('wrong');
    buttons[correct].classList.add('correct');
    document.getElementById('feedback').innerHTML =
      'اوه اوه، جواب درست رو هم پیدا کردیم! 😌 ' + explanation;
  }

  document.getElementById('feedback').style.display = 'block';

  const wrapper = document.createElement('div');
  wrapper.className = 'buttons';
  wrapper.innerHTML = `<button class="btn primary" onclick="go(${stage + 1})">ادامه‌ی پرونده 💌</button>`;
  document.getElementById('feedback').after(wrapper);
}

const stages = [

/* 1 */
() => `

    پس آماده باش، دانشمند خانم! 🧪🌷
  </p>
  <div class="note">
    <b>هشدار آزمایشگاه:</b>
    ورود به این سایت ممکن است باعث لبخند ناگهانی، افزایش میزان کیوتی
    و مشکوک شدن به یک جوجه‌ی خاص شود. 🐣
  </div>
  ${nextButton('ورود به آزمایشگاه 🧪')}
`,

/* 2 */
() => `
  <div class="stage-label">مرحله ۲ · شناسایی عنصر</div>
  <div class="big-emoji">⚗️</div>

  <p>
    دانشمندان سال‌هاست عناصر مختلف رو بررسی می‌کنن، اما ظاهراً یک عنصر
    هنوز توی جدول تناوبی کشف نشده: عنصر «ستیا»! ویژگی‌های این عنصر عجیب

  </p>

  ${optionQuiz(

    0,
    'البته این یک عنصر خیالیه؛ ولی واکنش‌های شیمیایی واقعی هم می‌تونن با تغییر دما و شرایط تغییر کنن!'
  )}
`,

/* 3 */
() => `

    ['انرژی به محیط آزاد می‌شود 🔥', 'انرژی همیشه نابود می‌شود', 'هیچ انرژی‌ای جابه‌جا نمی‌شود', 'همه‌ی مواد حتماً یخ می‌زنند'],
    0,
    'در واکنش گرماده، انرژی به محیط منتقل می‌شود و محیط می‌تواند گرم‌تر شود.'
  )}
`,

/* 4 */
() => `
  <div class="stage-label">مرحله ۴ · ورود گودزیلا</div>
  <div class="big-emoji">🧌🐣</div>
  <h1>گودزیلا و جوجه وارد آزمایشگاه شدند!</h1>
  <p>
    گزارش فوری: گودزیلا🧌 وارد آزمایشگاه شده و ادعا می‌کنه که فقط برای
    بررسی علمی اومده. ولی دوربین‌ها نشون می‌دن که پنج دقیقه‌ی گذشته رو

  </p>
  ${optionQuiz(
    'کدوم گزینه یک تغییر شیمیایی واقعی رو توصیف می‌کنه؟',
    ['زنگ زدن آهن', 'خرد شدن یک تکه گچ', 'ذوب شدن یخ', 'پاره شدن کاغذ'],
    0,
    'زنگ زدن آهن ماده‌ی جدیدی تولید می‌کند. بقیه‌ی گزینه‌ها عمدتاً تغییر فیزیکی‌اند.'

/* 7 */

function charge() {
  energy = Math.min(100, energy + 20);
  document.getElementById('meterFill').style.width = energy + '%';
  document.getElementById('energyText').textContent = `شارژ باتری: ${energy}٪`;

  const feedback = document.getElementById('energyFeedback');
  if (energy < 100) {
    feedback.textContent = 'عالیه! باتری داره شارژ می‌شه. یک بار دیگه بزن! ✨';
  } else {
    feedback.textContent = 'باتری صددرصد شارژ شد! گودزیلا قول داده غرغر نکنه... حداقل برای پنج دقیقه! 🧌💗';
    document.getElementById('energyNext').disabled = false;
  }
}

function unlockSecret() {
  const input = document.getElementById('secretInput').value.trim().toLowerCase();
  const feedback = document.getElementById('secretFeedback');
  const note = document.getElementById('secretNote');

  if (input === 'ستیا' || input === 'setia') {
    secretUnlocked = true;
    note.classList.remove('hidden');
    feedback.style.display = 'block';
    feedback.textContent = 'قفل باز شد! رمز درست بود، دانشمند عزیز! 🔓💗';
  } else {
    feedback.style.display = 'block';
    feedback.textContent = 'رمز درست نیست! یک بار دیگه امتحان کن. راهنمایی: اسم صاحب پرونده است. 🌸';
  }
}

function restart() {
  stage = 0;
  energy = 0;
  quizScore = 0;
  secretUnlocked = false;
  render();
}

function render() {
  updateProgress();
  app.innerHTML = stages[stage]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
